name: Update Nagueuleo Streak Stats

on:
  schedule:
    # Tous les jours à 03:00 UTC
    - cron: "0 3 * * *"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate streak stats
        uses: nagueuleo/github-readme-streak-stats@main
        with:
          options: >-
            user=nagueuleo&theme=radical&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub streak stats"

          git push