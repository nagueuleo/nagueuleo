name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nagueuleo
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import datetime

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-stats"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read())

          if "errors" in data:
              raise RuntimeError(data["errors"])

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          contribution_dates = {
              datetime.date.fromisoformat(day["date"]): day["count"]
              for day in days
              if day["count"] > 0
          }

          today = datetime.date.today()

          current_streak = 0
          check_date = today

          if check_date not in contribution_dates:
              check_date -= datetime.timedelta(days=1)

          while check_date in contribution_dates:
              current_streak += 1
              check_date -= datetime.timedelta(days=1)

          longest_streak = 0
          streak = 0
          previous = None

          for day in days:
              date = datetime.date.fromisoformat(day["date"])

              if day["count"] > 0:

                  if (
                      previous is not None
                      and date == previous + datetime.timedelta(days=1)
                  ):
                      streak += 1
                  else:
                      streak = 1

                  longest_streak = max(longest_streak, streak)
                  previous = date

          print("Total contributions:", total)
          print("Current streak:", current_streak)
          print("Longest streak:", longest_streak)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="900"
              height="300"
              viewBox="0 0 900 300">

            <defs>
              <linearGradient id="bg"
                x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#15121f"/>
                <stop offset="100%" stop-color="#100e17"/>
              </linearGradient>
            </defs>

            <rect
              x="1"
              y="1"
              width="898"
              height="298"
              rx="15"
              fill="url(#bg)"
              stroke="#d0d0d0"
              stroke-width="2"/>

            <line
              x1="300"
              y1="40"
              x2="300"
              y2="260"
              stroke="#d0d0d0"
              stroke-width="2"/>

            <line
              x1="600"
              y1="40"
              x2="600"
              y2="260"
              stroke="#d0d0d0"
              stroke-width="2"/>

            <text
              x="150"
              y="105"
              text-anchor="middle"
              font-family="Arial"
              font-size="46"
              font-weight="bold"
              fill="#ff4fa3">
              {total}
            </text>

            <text
              x="150"
              y="145"
              text-anchor="middle"
              font-family="Arial"
              font-size="20"
              fill="#ff4fa3">
              Total Contributions
            </text>

            <text
              x="150"
              y="185"
              text-anchor="middle"
              font-family="Arial"
              font-size="15"
              fill="#a8ffff">
              GitHub
            </text>

            <circle
              cx="450"
              cy="115"
              r="65"
              fill="none"
              stroke="#ff4fa3"
              stroke-width="9"/>

            <text
              x="450"
              y="130"
              text-anchor="middle"
              font-family="Arial"
              font-size="42"
              font-weight="bold"
              fill="#ffd83d">
              {current_streak}
            </text>

            <text
              x="450"
              y="175"
              text-anchor="middle"
              font-family="Arial"
              font-size="20"
              font-weight="bold"
              fill="#ffd83d">
              Current Streak
            </text>

            <text
              x="450"
              y="205"
              text-anchor="middle"
              font-family="Arial"
              font-size="15"
              fill="#a8ffff">
              days
            </text>

            <text
              x="750"
              y="105"
              text-anchor="middle"
              font-family="Arial"
              font-size="46"
              font-weight="bold"
              fill="#ff4fa3">
              {longest_streak}
            </text>

            <text
              x="750"
              y="145"
              text-anchor="middle"
              font-family="Arial"
              font-size="20"
              fill="#ff4fa3">
              Longest Streak
            </text>

            <text
              x="750"
              y="185"
              text-anchor="middle"
              font-family="Arial"
              font-size="15"
              fill="#a8ffff">
              days
            </text>

          </svg>'''

          with open("github-stats.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi